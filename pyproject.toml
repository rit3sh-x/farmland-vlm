[project]
name = "farmvlm"
version = "0.1.0"
description = "LoRA-fine-tuned captioning and VQA for crop anomalies in Agriculture-Vision tiles (AI 512 Project 3)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10", "scikit-learn==1.6.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
colab = ["pycocoevalcap>=1.2", "peft>=0.21"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9"]
report = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["farmvlm"]
