[project]
name = "farmvlm"
version = "0.1.0"
description = "LoRA-fine-tuned captioning and VQA for crop anomalies in Agriculture-Vision tiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pillow>=10", "scikit-learn==1.6.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pycocoevalcap>=1.2"]
colab = ["pycocoevalcap>=1.2", "peft>=0.21"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9",
       "torch>=2.4", "transformers>=5", "peft>=0.21", "huggingface_hub>=0.30", "xllamacpp>=2026.10.11870"]
train = ["torch>=2.4", "transformers>=5", "peft>=0.21", "huggingface_hub>=0.30", "pycocoevalcap>=1.2"]
report = ["matplotlib>=3.8", "pycocoevalcap>=1.2"]

[project.scripts]
farmvlm-serve = "farmvlm.serve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["farmvlm"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
conflicts = [[{ extra = "app" }, { extra = "train" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "app" }]
